name = "pressor-rates"

# The one path the separate verifier collects from the agent's final container. Top level on
# purpose: Harbor drops an artifacts list placed under [verifier].
artifacts = ["/app/audit/src/"]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Operations"
subcategory = "Compliance"
tags = ["typescript", "medication-safety", "infusion-pumps", "hl7-feed", "icu-audit"]
languages = ["typescript"]
difficulty = "core"
expert_time_estimate_hours = 5
is_multi_container = true
difficulty_explanation = "The agent writes a TypeScript tool for an ICU medication safety committee that reads a week of messages from the hospital's interface engine (charted weights, pressor order versions and smart pump programming events) and reports, per order, the micrograms the patient got, the seconds above and below the ordered range and the peak dose, exactly. The hard part is the weight a dose is per kg of, because on a real ICU the charted weight moves all stay and most of its movement is not the patient: bed scales weigh the air mattress and linen, nurses chart hours after weighing, a bed weight is later charted again with status C under the same observation, sometimes twice, the renal team charts a dry weight nobody weighed, and fluid resuscitation adds kilograms daily. Pharmacy verifies each order version against one scale weight, the one taken last among those already filed when it signed, and a correction filed afterwards changes that weight back to the moment it was taken, while a weight taken earlier but filed late does not count. Separately the pump knows none of this: it works the rate out from the weight the nurse keyed off the bed display, rounds to a tenth of a mL/h, holds the dose when the weight or the bag changes, stops on alarms, and two channels overlap at bag changes. So the drug delivered follows the pump's weight and the dose judged against the order follows pharmacy's corrected weight, and a tool that takes either weight for the other, trusts the pump's own dose display, or applies a correction from when it was filed produces a report of the right shape that agrees with the committee's signed example week and is still wrong. The rule book in solution/generate_feed.py expresses 21 such misreadings; on the shipped week each moves between 6 and 56 of 68 graded figures, on the held-back week between 5 and 72 of 104, and every one moves at least one figure on each of 8 fresh seeds of both, while the signed example week does not move under 10 of them, every weight, correction, overlap and alarm reading among them. None of the facts is hard alone; the expert's work is keeping the pump's world and the pharmacy's world apart and joining them only through the micrograms per minute."
solution_explanation = "solve.sh copies solution/src/main.ts into /app/audit/src and builds it with the project's tsconfig. The tool opens a TCP connection with node's net module to ENGINE_HOST and ENGINE_PORT, asks FEED and follows the page tokens to END, buffering bytes into lines because pages arrive in arbitrary pieces, waiting out a BUSY before asking again, and reopening the connection and repeating the request when the engine closes it after twenty answers. Weights are kept per observation with the time first filed and the figure filed last. Each order version's dosing weight is the BED, STAND or HOIST weight of the stay with the latest taken time among those first filed at or before the signing, else the stated weight, at its final figure. Pump lines are replayed per channel in time order: START sets dose, keyed weight and concentration and ends whatever program the channel was running for another order, DOSE, WEIGHT and BAG change one of them, ALARM and RESUME stop and restart, STOP ends; the rate is the nearest tenth of dose x weight x 60 / conc (or dose x 60 / conc) computed in integers. Between consecutive event and signing times the tool sums rate x conc over the order's live channels (a sum of zero means nothing is pushing and the order is not running), adds it times the seconds to the delivered total, and compares 1000 x that sum with the in-effect version's limit times 60 x the dosing weight (or 600 for per-minute orders), all in BigInt, so every comparison and both floors are exact. On the three graded weeks and on the example week this TypeScript prints exactly what the Python rule book prints; that rule book was written before it, separately, and calibrate.py flips its readings one at a time to measure the wrong routes."
verification_explanation = "Grading happens in its own container, which is handed nothing from the agent's box but the sources under /app/audit/src. Only TypeScript reaches the compiler: links and every file under src not ending in .ts are deleted (declaration files stay), the tsconfig is the grader's own, and tsc runs as an unprivileged user through a seccomp launcher (tests/launch.c) that refuses any other exec; the output becomes root-owned, and the compiler's package tree is then closed to that user. The compiled tool then runs three times, as that user through the same launcher, ten minutes each, against an engine test.sh starts from copies baked into the verifier image: the shipped week on 127.0.0.2 with another port, page size and BUSY pattern, a held-back week (another month, unit habits, bag size and concentrations, 26 orders, one of them signed and discontinued without ever running and one per-kg order run on a per-minute pump program) on 127.0.0.1, and a five-order week reached by the host name engine.icu.internal. Before anything untrusted runs, /tests, the weeks, the engine, the run directory and /logs/verifier are closed to that user and probed with a listing, root's PATH is checked for writable entries, and scratch space is swept between runs; pytest runs by absolute path with -P and every file it reads is opened with O_NOFOLLOW. No report is worked out while grading. Every expected report is backed by two implementations of SPEC.md written separately: the Python rule book (solution/generate_feed.py, tests/golden) and the compiled TypeScript reference run against the engine (solution/make_golden_ref.py, tests/golden_ref), and the first check requires the two to be identical for every week. The other checks are that the build succeeded, that each run printed one JSON line with a member for exactly the week's orders and four whole numbers each, that every delivered_mcg, over_s, under_s and peak equals the golden exactly (12 checks, one per week and figure), and that each engine's log shows it answered BUSY and later served the last page. The reference scores 1, and so does the reference with its row type in src/types.d.ts; doing nothing scores 0, and fourteen wrong variants run through this verifier all score 0: a truncated rate, corrections ignored, late-charted weights counted, the dry weight counted, one channel of an overlap, a weight re-key ignored, alarms ignored, the first version's weight kept, the weight filed last, the pump's keyed weight as the dosing weight, the shipped week's report printed as a constant, an order that never ran left out of the report, and a tool that loads the installed typescript package at run time, and a tool that reads each pump program in the order's unit instead of its own."
relevant_experience = "I have worked on ICU medication safety audits where vasopressor titration compliance was reviewed from smart pump logs against the pharmacy record, and the recurring argument was always about the weight: the bed scale with the pressure mattress on, the admission weight the family guessed, the weight the nurse keyed into the pump that nobody updated after the chart was corrected. Reconciling a pump's dose display with the dose per kg the prescriber meant is exactly the part that takes an experienced pharmacist or informatics nurse a careful afternoon per case."

